<body class="auth-page">
  <header class="site-header auth-header"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 24"><path d="M2 12s5.7-9 16-9 16 9 16 9-5.7 9-16 9S2 12 2 12Z"/><circle cx="18" cy="12" r="4.3"/><circle class="pupil" cx="18" cy="12" r="1.7"/></svg></span><span class="brand-name">Noida Eye &amp; Medical Centre</span></a><a class="back-home" href="/">← Back to website</a></header>
  <main class="auth-main"><div class="auth-decoration"><span class="auth-orbit"></span><span class="auth-spark">✳</span><div><small>NOIDA EYE AND MEDICAL CENTRE</small><p>Care starts<br>with a clear view.</p></div><span class="auth-deco-note">OWNER ACCESS · PRIVATE</span></div><section class="auth-card"><div class="eyebrow">OWNER PORTAL</div><h1>Welcome<br><em>back.</em></h1><p class="auth-intro">Sign in to access the clinic administration area.</p><form id="login-form"><label class="field">Username<input name="username" autocomplete="username" required autofocus placeholder="Your admin username"></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" required placeholder="Your password"></label><p class="auth-error" id="login-error" role="alert"></p><button class="button button-dark button-full" type="submit">Sign in securely <span>↗</span></button></form><p class="auth-footnote">Owner access only. Your session expires after 8 hours.</p></section></main>
